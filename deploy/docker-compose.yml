# AchsoKumpel on the server (~/achsokumpel). deploy.sh uploads this file with
# site/, server/ and .env (from deploy/secrets/server.env) next to it.
# Host nginx proxies the two domains to the web and api ports.
name: achsokumpel

services:
  web:
    build:
      context: .
      dockerfile: web.Dockerfile
    image: achsokumpel-web:latest
    restart: unless-stopped
    ports:
      - '127.0.0.1:3030:80'

  api:
    build: ./server
    image: achsokumpel-api:latest
    restart: unless-stopped
    environment:
      ALLOWED_ORIGINS: https://achsokumpel.deviofy.com
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '127.0.0.1:4030:8787'

  # Accounts and progress. Reachable from your PC only through an SSH tunnel.
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - '127.0.0.1:5440:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

# Survives deploys; only `docker volume rm achsokumpel-pgdata` deletes it.
volumes:
  pgdata:
    name: achsokumpel-pgdata
