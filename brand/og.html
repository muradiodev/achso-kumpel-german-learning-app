<!doctype html>
<html>
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  * { margin: 0; box-sizing: border-box; }
  body { width: 1200px; height: 630px; font-family: 'Plus Jakarta Sans', sans-serif; background: #6E3BE0; color: #fff; display: flex; overflow: hidden; }
  .left { padding: 72px 0 72px 80px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 16px; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; }
  .brand img { width: 64px; height: 64px; border-radius: 16px; background: #fff; }
  h1 { font-size: 76px; line-height: 1.02; font-weight: 800; letter-spacing: -0.04em; }
  p { font-size: 26px; opacity: 0.86; font-weight: 500; }
  .right { width: 470px; position: relative; }
  .right img { position: absolute; width: 330px; border-radius: 40px; box-shadow: 0 30px 80px rgba(20, 8, 60, 0.45); top: 60px; left: 60px; transform: rotate(4deg); }
</style>
</head>
<body>
  <div class="left">
    <div class="brand"><img src="logo/symbol-duo.svg" alt="">AchsoKumpel</div>
    <h1>You know German.<br>Now use it.</h1>
    <p>Free and open source. Ten minutes a day.</p>
  </div>
  <div class="right"><img src="../docs/screenshots/sentence-builder.png" alt=""></div>
</body>
</html>
